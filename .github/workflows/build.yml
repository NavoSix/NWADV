name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (physics, GPX, map data)
        run: ./gradlew :core:test --console=plain

      - name: Build Android APK
        run: ./gradlew :android:assembleDebug :android:assembleRelease --console=plain

      - name: Build desktop version
        run: ./gradlew :desktop:distZip --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: nwadv-android
          path: |
            android/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nwadv-desktop
          path: desktop/build/distributions/*.zip

  # The desktop game for Windows, packaged with its own Java runtime: unzip and run
  # NorthwoodsADV.exe, nothing to install.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the desktop game
        run: ./gradlew.bat :desktop:installDist --console=plain

      - name: Package with a bundled Java runtime
        shell: pwsh
        run: |
          $jar = (Get-ChildItem desktop/build/install/desktop/lib/desktop-*.jar).Name
          jpackage --type app-image --name NorthwoodsADV --input desktop/build/install/desktop/lib --main-jar $jar `
            --main-class com.northwoodsadv.ride.desktop.DesktopLauncherKt --dest dist --java-options "-Xmx2g"
          Compress-Archive -Path dist/NorthwoodsADV -DestinationPath NorthwoodsADV-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nwadv-windows
          path: NorthwoodsADV-windows.zip
