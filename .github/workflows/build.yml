name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (physics, GPX, map data)
        run: ./gradlew :core:test --console=plain

      - name: Build Android APK
        run: ./gradlew :android:assembleDebug :android:assembleRelease --console=plain

      - name: Build desktop version
        run: ./gradlew :desktop:distZip --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: nwadv-android
          path: |
            android/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nwadv-desktop
          path: desktop/build/distributions/*.zip
